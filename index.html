  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

0%,#1f8cff 42%,#0a5fd6 100%);\n  }\n\n  *{box-sizing:border-box;margin:0;padding:0;}\n  html,body{height:100%;}\n  body{\n    background:var(--bg-0);\n    color:var(--ink);\n    font-family:'Archivo',system-ui,sans-serif;\n    -webkit-font-smoothing:antialiased;\n    overflow:hidden;\n    position:relative;\n  }\n\n  /* ====== Cinematic background ====== */\n  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:\n      radial-gradient(120% 80% at 50% -10%, #0d1c33 0%, #070d18 45%, #04070e 100%);}\n  .bg::after{ /* vignette */\n    content:\"\";position:absolute;inset:0;\n    background:radial-gradient(120% 120% at 50% 45%, transparent 55%, rgba(0,0,0,.7) 100%);\n    pointer-events:none;\n  }\n  .glow{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;mix-blend-mode:screen;}\n  .glow.a{width:46vw;height:46vw;left:-12vw;top:-14vw;background:radial-gradient(circle,#1c6fd6,transparent 65%);animation:drift1 22s ease-in-out infinite;}\n  .glow.b{width:40vw;height:40vw;right:-12vw;bottom:-16vw;background:radial-gradient(circle,#0a3f9e,transparent 65%);animation:drift2 27s ease-in-out infinite;}\n  .glow.c{width:30vw;height:30vw;left:42vw;top:55vh;background:radial-gradient(circle,#2ea6ff,transparent 60%);opacity:.3;animation:drift3 19s ease-in-out infinite;}\n  @keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(6vw,5vh)}}\n  @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-5vw,-4vh)}}\n  @keyframes drift3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-4vw,-6vh) scale(1.12)}}\n\n  /* faint particle field */\n  .particles{position:absolute;inset:0;background-image:\n     radial-gradient(1.4px 1.4px at 20% 30%, rgba(150,200,255,.7), transparent),\n     radial-gradient(1.2px 1.2px at 75% 20%, rgba(120,180,255,.6), transparent),\n     radial-gradient(1.3px 1.3px at 60% 70%, rgba(150,200,255,.5), transparent),\n     radial-gradient(1px 1px at 35% 80%, rgba(120,180,255,.5), transparent),\n     radial-gradient(1.1px 1.1px at 88% 60%, rgba(150,200,255,.55), transparent),\n     radial-gradient(1px 1px at 10% 65%, rgba(120,180,255,.45), transparent);\n    animation:twinkle 6s ease-in-out infinite;opacity:.7;}\n  @keyframes twinkle{0%,100%{opacity:.4}50%{opacity:.85}}\n\n  /* ====== Shell ====== */\n  .shell{position:relative;z-index:2;height:100%;min-height:100dvh;display:flex;flex-direction:column;\n    padding:clamp(18px,3vh,34px) clamp(16px,4vw,52px) clamp(16px,2.6vh,30px);}\n\n  /* ====== Brand header ====== */\n  .head{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;\n    animation:appear .8s ease;}\n  .logo-badge{background:#fff;border-radius:14px;padding:13px 22px;display:inline-flex;\n    box-shadow:0 18px 44px -18px rgba(0,0,0,.7), 0 0 50px -10px rgba(46,166,255,.4);}\n  .logo{width:clamp(180px,23vw,250px);height:auto;display:block;}\n  .who{font-size:clamp(11px,1.15vw,13px);letter-spacing:.22em;text-transform:uppercase;color:var(--ink-dim);font-weight:600;}\n  .who b{color:var(--ink);font-weight:700;}\n\n  /* ====== Intro line ====== */\n  .lead{flex:0 0 auto;text-align:center;margin:clamp(14px,2.4vh,28px) 0 clamp(14px,2vh,22px);\n    animation:appear .8s ease;}\n  .lead h1{font-family:'Anton',sans-serif;font-weight:400;line-height:.92;letter-spacing:.005em;\n    font-size:clamp(30px,5.4vw,62px);text-transform:uppercase;}\n  .lead h1 .accent{color:transparent;background:var(--grad-blue);-webkit-background-clip:text;background-clip:text;\n    filter:drop-shadow(0 4px 26px rgba(46,166,255,.35));}\n  .lead p{margin-top:12px;color:var(--ink-dim);font-size:clamp(13px,1.5vw,16px);font-weight:500;letter-spacing:.01em;}\n\n  /* ====== Doors ====== */\n  .doors{flex:1 1 auto;display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,1.6vw,22px);min-height:0;\n    align-content:stretch;}\n  .door{position:relative;display:block;text-decoration:none;color:inherit;overflow:hidden;\n    border-radius:18px;border:1px sol p(10px,1.05vw,12px);letter-spacing:.24em;text-transform:uppercase;font-weight:700;color:#bcd2f2;\n    padding:7px 13px;border:1px solid rgba(140,180,240,.28);border-radius:999px;\n    background:rgba(10,22,42,.5);backdrop-filter:blur(6px);}\n  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--blue);box-shadow:0 0 10px var(--blue);}\n  .door h2{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;line-height:.88;letter-spacing:.015em;\n    font-size:clamp(40px,5.6vw,72px);}\n  .door h2 .b{color:transparent;background:var(--grad-blue);-webkit-background-clip:text;background-clip:text;}\n  .door p.desc{color:var(--ink-dim);font-size:clamp(13px,1.4vw,16px);max-width:30ch;font-weight:500;line-height:1.45;}\n  .cta{display:inline-flex;align-items:center;gap:12px;margin-top:6px;align-self:flex-start;\n    font-weight:700;font-size:clamp(13px,1.45vw,16px);letter-spacing:.01em;color:#fff;\n    padding:13px 22px;border-radius:999px;background:linear-gradient(180deg,#2ea6ff,#0a5fd6);\n    box-shadow:0 14px 30px -12px rgba(46,166,255,.6),inset 0 1px 0 rgba(255,255,255,.35);\n    transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s;}\n  .door.d2 .cta{background:linear-gradient(180deg,#27d27a,#0f9d57);\n    box-shadow:0 14px 30px -12px rgba(39,210,122,.55),inset 0 1px 0 rgba(255,255,255,.3);}\n  .cta .arrow{width:20px;height:20px;display:grid;place-items:center;transition:transform .35s;}\n  .cta svg{width:18px;height:18px;stroke:#fff;stroke-width:2.4;fill:none;}\n\n  /* hover/focus */\n  @media (hover:hover){\n    .door:hover{transform:translateY(-6px);border-color:rgba(120,170,255,.5);\n      box-shadow:0 40px 90px -30px rgba(0,0,0,.95),0 0 0 1px rgba(120,170,255,.35),0 24px 70px -30px rgba(46,166,255,.5);}\n    .door:hover .photo{transform:scale(1.07);}\n    .door.d1:hover .photo{filter:grayscale(1) contrast(1.08) brightness(.92);}\n    .door.d2:hover .photo{filter:contrast(1.05) brightness(.9) saturate(.95);}\n    .door:ho
